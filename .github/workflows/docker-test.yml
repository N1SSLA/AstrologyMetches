name: Docker Test on Self-Hosted

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  run-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: cmd
        run: docker build -t astro-test .

      - name: Run tests in Docker
        shell: cmd
        run: docker run --rm astro-test