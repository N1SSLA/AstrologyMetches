name: Docker Test on Self-Hosted

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:  

jobs:
  run-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Docker container
	shell: cmd
        run: docker run --rm alpine echo "Docker works on push!"