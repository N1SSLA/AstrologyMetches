  deploy:
    needs: run-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: cmd
        run: docker build -t astro-test .


      - name: Run tests in Docker
        shell: cmd
        run: docker run --rm astro-test